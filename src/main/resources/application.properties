spring.application.name=toogodtogo-clone

# Datenbank (MariaDB aus src/docker-compose.yaml)
spring.datasource.url=jdbc:mariadb://localhost:3306/toogoodtogo
spring.datasource.username=user
spring.datasource.password=password

# Hibernate passt das Schema an die Entities an (nur fuer Entwicklung)
spring.jpa.hibernate.ddl-auto=update

# Validierungsfehler in der Error-Response anzeigen
# (Folie: server.error.include-binding-errors – ab Spring Boot 4 heisst die Property spring.web.error.*)
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
