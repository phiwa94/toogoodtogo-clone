spring.application.name=toogodtogo-clone

# database (mariadb from the docker compose file)
spring.datasource.url=jdbc:mariadb://localhost:3306/toogoodtogo
spring.datasource.username=user
spring.datasource.password=password

# hibernate updates the tables to match the entities (only for development)
spring.jpa.hibernate.ddl-auto=update

# show validation errors in the error response
# the slides use the old server.error property, since spring boot 4 it is spring.web.error
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
